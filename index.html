<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Unit 12 Project</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <button id="mem1-button">chill</button>
    <button id="mem2-button">bugs</button>
    <button id="mem3-button">jumpin</button>
    <h1>frohgs</h1>
    <ol>
      <li>
        <h3 id="mem1">they're chill asf</h3>
        <p>boom</p>
      </li>
      <img src="https://www.sciencesource.com/pix/113/1130633-bullfrog-wearing-sunglasses.jpg" width="300">
      <li>
        <h3 id="mem2">they eat bugs</h3>
        <p>gurt: yo</p>
      </li>
      <img src="https://media.gettyimages.com/id/1175266412/video/slomo-frog-leaps-and-catches-damselfly-in-marsh-germany.jpg?s=640x640&k=20&c=nKe4amey8TKMVe2u7R-NIqwgtMBlRYaZI5fhw2YjXj0=" width="300">
      <li>
        <h3 id="mem3">they be jumpin</h3>
        <p>theoretically they could dunk</p>
      </li>
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSLMHGKPHrWLrsa5aJ1eJh3bHh3AYYmlrN8jg&s" width="300">
    </ol>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.4/jquery.min.js"></script>
    <script>
      // jQuery Methods
      $("#mem1-button").click(function () {
        $("#mem1").css("color", "orange");
        $("ol").fadeOut();
      });

      $("#mem2-button").click(function () {
        $("#mem2").css("color", "orange");
        $("h1").text("frogs r friggin tuff yo");
      });

      $("#mem3-button").click(function () {
        $("#mem3").css("color", "orange");
        $("img").slideUp();
      });
    </script>
  </body>
</html>
